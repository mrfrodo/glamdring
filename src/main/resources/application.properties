spring.application.name=glamdring

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:glamdringdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema init
spring.sql.init.mode=always

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Scheduler refresh rate (ms) — 60 seconds
glamdring.scheduler.refresh-rate-ms=60000

# Ollama (local LLM) — via Spring AI
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2:0.5b

# Code-specific model, for future use
# glamdring.ollama.models.code=qwen2.5-coder:0.5b
