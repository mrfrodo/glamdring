spring.application.name=glamdring

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:glamdringdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema init
spring.sql.init.mode=always

# Exclude all JPA/Hibernate auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Scheduler refresh rate (ms) — 60 seconds
glamdring.scheduler.refresh-rate-ms=60000
