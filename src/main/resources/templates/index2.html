<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamdring — The Foe-hammer</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f33;
            --accent-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 3rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Glødende alvisk effektaura i toppen */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
        }

        .sword-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
            animation: pulse 3s infinite ease-in-out;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            font-size: 1rem;
            font-style: italic;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.8)); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sword-icon">⚔️</div>
    <h1>Glamdring</h1>
    <p class="subtitle">The Foe-hammer — Forged in Gondolin</p>

</div>

</body>
</html>
