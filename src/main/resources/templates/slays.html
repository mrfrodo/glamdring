<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Slay Log — Glamdring.no</title>
    <meta name="description" content="A running log of real domain complexity found and slain — before/after case studies from software built with DDD and hexagonal architecture.">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="slays-body">

<div class="top-banner">
    <p>Make better software - Slay domain complexity</p>
</div>

<main class="slays-page">
    <a class="back-link" th:href="@{/}">&larr; Back to Glamdring</a>

    <h1 class="slays-heading">The Slay Log</h1>
    <p class="slays-subheading">Complexity slain, one refactor at a time.</p>

    <div class="slays-list">
        <article th:each="slay : ${slays}" class="slay-card">
            <div class="slay-header">
                <span class="slay-topic" th:text="${slay.topic.searchTerm}"></span>
                <span class="slay-date" th:text="${#temporals.format(slay.slainOn, 'MMM dd, yyyy')}"></span>
            </div>
            <h2 class="slay-title" th:text="${slay.title}"></h2>
            <p class="slay-field"><span class="slay-field-label">The Smell</span><span th:text="${slay.smell}"></span></p>
            <p class="slay-field"><span class="slay-field-label">The Slay</span><span th:text="${slay.theSlay}"></span></p>
            <p class="slay-field slay-lesson"><span class="slay-field-label">Lesson</span><span th:text="${slay.lesson}"></span></p>
        </article>

        <p th:if="${#lists.isEmpty(slays)}" class="slays-empty">No slays logged yet — the hunt is young.</p>
    </div>
</main>

</body>
</html>
